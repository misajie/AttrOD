[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attrOD"
version = "0.1.0"
description = "AttrOD: Condition S and Condition G experiments for attribute-specific urban OD matrices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AttrOD"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "networkx>=3.0",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
geo = ["geopandas>=0.14", "shapely>=2.0", "pyproj>=3.5"]
dev = ["pytest>=7.0"]

[project.scripts]
attrOD-build-partitions = "attrOD.scripts_entry:build_partitions"
attrOD-run-condition-s = "attrOD.scripts_entry:run_condition_s"
attrOD-run-condition-g = "attrOD.scripts_entry:run_condition_g"
attrOD-make-spatial-blocks = "attrOD.scripts_entry:make_spatial_blocks"
attrOD-aggregate-tessellation = "attrOD.scripts_entry:aggregate_tessellation"
attrOD-audit-data-readiness = "attrOD.scripts_entry:audit_data_readiness"
attrOD-run-hk-smoke = "attrOD.scripts_entry:run_hk_smoke"
attrOD-run = "attrOD.scripts_entry:run_orchestrator"
attrOD-build-metric-distances = "attrOD.scripts_entry:build_metric_distances"
attrOD-run-mitma-condition-s = "attrOD.scripts_entry:run_mitma_condition_s"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
